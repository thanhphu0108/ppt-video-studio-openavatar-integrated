<!doctype html>
<html>
<head><meta charset="utf-8"><style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;color:#334155}
.box{border:1px solid #cbd5e1;border-radius:10px;padding:12px;background:#f8fafc}
.ok{color:#047857}.err{color:#b91c1c}.muted{color:#64748b;font-size:13px}
button{border:0;border-radius:8px;padding:9px 14px;background:#2563eb;color:white;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
</style></head>
<body><div class="box"><div id="status" class="muted">Đang khởi tạo cầu nối OpenAvatar Runtime…</div><button id="run" style="display:none">Thực hiện</button></div>
<script>
let args = {};
const statusEl = document.getElementById('status');
const runBtn = document.getElementById('run');
function post(type, data={}) { window.parent.postMessage({isStreamlitMessage:true,type,...data}, '*'); }
function ready(){ post('streamlit:componentReady',{apiVersion:1}); post('streamlit:setFrameHeight',{height:78}); }
function value(v){ post('streamlit:setComponentValue',{value:v}); }
function dataUrlToBlob(dataUrl){ const [head,b64]=dataUrl.split(','); const mime=(head.match(/data:(.*?);/)||[])[1]||'application/octet-stream'; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }

const CACHE_DB_NAME='ppt-video-local-runtime-cache';
const CACHE_DB_VERSION=1;
const CACHE_STORE='artifacts';

function openCacheDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(CACHE_DB_NAME,CACHE_DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(CACHE_STORE)){
        db.createObjectStore(CACHE_STORE,{keyPath:'key'});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

async function cacheGet(key){
  if(!key || !('indexedDB' in window)) return null;
  try{
    const db=await openCacheDb();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(CACHE_STORE,'readonly');
      const req=tx.objectStore(CACHE_STORE).get(key);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch(_){ return null; }
}

async function cachePut(key,kind,contentType,base64){
  if(!key || !base64 || !('indexedDB' in window)) return false;
  try{
    const db=await openCacheDb();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(CACHE_STORE,'readwrite');
      tx.objectStore(CACHE_STORE).put({
        key,kind,content_type:contentType||'application/octet-stream',
        base64,updated_at:Date.now()
      });
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
    return true;
  }catch(_){ return false; }
}

function arrayBufferToBase64(buffer){ const bytes=new Uint8Array(buffer); let binary=''; const chunk=0x8000; for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+chunk,bytes.length)));} return btoa(binary); }
async function execute(){
  runBtn.disabled=true; statusEl.className='muted';
  const base=(args.agent_url||'http://127.0.0.1:8008').replace(/\/$/,'');
  try{
    if(args.action==='health'){
      statusEl.textContent='Đang kiểm tra OpenAvatar Runtime…';
      const r=await fetch(base+'/health',{method:'GET'}); const payload=await r.json();
      if(!r.ok) throw new Error(payload.detail||('HTTP '+r.status));
      statusEl.className='ok'; statusEl.textContent='✓ '+(payload.message||payload.gpu||'OpenAvatar Runtime sẵn sàng');
      value({ok:true,kind:'health',payload,request_id:args.request_id}); return;
    }
    if(args.action==='generate'){
      if(args.cache_key){
        const cached=await cacheGet('avatar:'+args.cache_key);
        if(cached && cached.base64){
          statusEl.className='ok';
          statusEl.textContent='✓ Dùng clip nhép môi từ browser cache.';
          value({
            ok:true,kind:'video',video_base64:cached.base64,
            content_type:cached.content_type||'video/mp4',
            cache_hit:true,cache_source:'indexeddb',
            request_id:args.request_id
          });
          return;
        }
      }
      statusEl.textContent='Đang gửi ảnh và audio tới OpenAvatar Runtime…';
      const fd=new FormData();
      fd.append('image',dataUrlToBlob(args.image_data_url),'avatar.png');
      fd.append('audio',dataUrlToBlob(args.audio_data_url),'narration.mp3');
      fd.append('engine',args.engine||'wav2lip');

      const create=await fetch(base+'/avatar/generate',{method:'POST',body:fd});
      if(!create.ok){ let t=await create.text(); throw new Error(t||('HTTP '+create.status)); }
      const job=await create.json();
      if(!job.id) throw new Error('Runtime không trả job_id.');

      statusEl.textContent='Đã xếp hàng. Đang chờ GPU xử lý…';
      const deadline=Date.now()+30*60*1000;
      let current=job;
      while(Date.now()<deadline){
        await new Promise(resolve=>setTimeout(resolve,1000));
        const poll=await fetch(base+'/jobs/'+encodeURIComponent(job.id));
        if(!poll.ok){ let t=await poll.text(); throw new Error(t||('HTTP '+poll.status)); }
        current=await poll.json();
        const progress=current.progress??0;
        statusEl.textContent='OpenAvatar Runtime đang xử lý: '+progress+'%';
        if(current.status==='failed' || current.status==='cancelled'){
          throw new Error(current.error||current.message||'Runtime xử lý thất bại.');
        }
        if(current.status==='completed') break;
      }
      if(current.status!=='completed') throw new Error('Runtime xử lý quá thời gian chờ.');

      statusEl.textContent='Đang tải video avatar từ Runtime…';
      const download=await fetch(base+'/jobs/'+encodeURIComponent(job.id)+'/download');
      if(!download.ok){ let t=await download.text(); throw new Error(t||('HTTP '+download.status)); }
      const buf=await download.arrayBuffer();
      const ct=(download.headers.get('content-type')||'video/mp4').toLowerCase();
      const videoB64=arrayBufferToBase64(buf);
      if(args.cache_key){
        await cachePut('avatar:'+args.cache_key,'video',ct,videoB64);
      }
      statusEl.className='ok'; statusEl.textContent='✓ OpenAvatar Runtime đã tạo xong video avatar.';
      value({
        ok:true,
        kind:'video',
        video_base64:videoB64,
        content_type:ct,
        job_id:job.id,
        request_id:args.request_id
      });
      return;
    }

    if(args.action==='voice_health'){
      statusEl.textContent='Đang kiểm tra Local Voice Clone…';
      const r=await fetch(base+'/health',{method:'GET'});
      const payload=await r.json();
      if(!r.ok) throw new Error(payload.detail||payload.message||('HTTP '+r.status));
      statusEl.className='ok';
      statusEl.textContent='✓ '+(payload.service||'Local Voice Clone')+' sẵn sàng';
      value({ok:true,kind:'voice_health',payload,request_id:args.request_id});
      return;
    }

    if(args.action==='voice_synthesize'){
      if(args.cache_key){
        const cached=await cacheGet('audio:'+args.cache_key);
        if(cached && cached.base64){
          statusEl.className='ok';
          statusEl.textContent='✓ Dùng audio từ browser cache.';
          value({
            ok:true,kind:'audio',audio_base64:cached.base64,
            content_type:cached.content_type||'audio/wav',
            cache_hit:true,cache_source:'indexeddb',
            request_id:args.request_id
          });
          return;
        }
      }
      statusEl.textContent='Đang tạo giọng bằng F5-TTS trên GPU local…';
      if(!args.reference_audio_data_url) throw new Error('Thiếu mẫu giọng.');
      if(!args.text) throw new Error('Thiếu nội dung cần đọc.');

      const fd=new FormData();
      fd.append('reference_audio',dataUrlToBlob(args.reference_audio_data_url),
                args.reference_audio_filename||'reference.wav');
      fd.append('text',args.text||'');
      fd.append('voice_id',args.voice_id||'default');
      fd.append('model',args.model||'f5-tts');
      if(args.reference_text) fd.append('reference_text',args.reference_text);
      fd.append('voice_use_consent', args.voice_use_consent ? 'true' : 'false');
      fd.append('language','vi');
      fd.append('speed','1.0');
      fd.append('output_format','wav');
      fd.append('return_audio','true');
      const headers={};
      if(args.api_key) headers['X-API-Key']=args.api_key;
      if(args.upload_password) headers['X-Voice-Upload-Password']=args.upload_password;

      const r=await fetch(base+'/v1/voice-clone/synthesize',{
        method:'POST',headers,body:fd
      });

      if(!r.ok){
        let detail='';
        try{
          const p=await r.json();
          detail=p.message||p.detail||JSON.stringify(p);
        }catch(_){
          try{ detail=await r.text(); }catch(__){}
        }
        throw new Error('HTTP '+r.status+(detail ? ': '+detail : ''));
      }

      const ct=(r.headers.get('content-type')||'').toLowerCase();
      if(ct.includes('audio/') || ct.includes('application/octet-stream')){
        const buf=await r.arrayBuffer();
        const audioB64=arrayBufferToBase64(buf);
        if(args.cache_key){
          await cachePut('audio:'+args.cache_key,'audio',ct||'audio/wav',audioB64);
        }
        statusEl.className='ok';
        statusEl.textContent='✓ Đã tạo audio bằng GPU local.';
        value({ok:true,kind:'audio',audio_base64:audioB64,
               content_type:ct||'audio/wav',request_id:args.request_id});
        return;
      }

      const payload=await r.json();
      if(payload.audio_base64){
        if(args.cache_key){
          await cachePut(
            'audio:'+args.cache_key,'audio',
            payload.content_type||'audio/wav',payload.audio_base64
          );
        }
        statusEl.className='ok';
        statusEl.textContent='✓ Đã tạo audio bằng GPU local.';
        value({ok:true,kind:'audio',audio_base64:payload.audio_base64,
               content_type:payload.content_type||'audio/wav',
               payload,request_id:args.request_id});
        return;
      }

      if(payload.audio_url){
        const audioUrl=new URL(payload.audio_url,base).toString();
        statusEl.textContent='Đang tải audio từ Local Voice Clone…';
        const ar=await fetch(audioUrl);
        if(!ar.ok) throw new Error('Không tải được audio: HTTP '+ar.status);
        const buf=await ar.arrayBuffer();
        const audioB64=arrayBufferToBase64(buf);
        const audioCt=(ar.headers.get('content-type')||'audio/wav');
        if(args.cache_key){
          await cachePut('audio:'+args.cache_key,'audio',audioCt,audioB64);
        }
        statusEl.className='ok';
        statusEl.textContent='✓ Đã tạo audio bằng GPU local.';
        value({ok:true,kind:'audio',audio_base64:audioB64,
               content_type:audioCt,
               payload,request_id:args.request_id});
        return;
      }

      throw new Error('Voice Clone service không trả audio_base64 hoặc audio_url.');
    }

    throw new Error('Action không hợp lệ.');
  }catch(e){ statusEl.className='err'; statusEl.textContent='Không gọi được dịch vụ local: '+e.message; value({ok:false,error:String(e.message||e),request_id:args.request_id}); }
  finally{runBtn.disabled=false;}
}
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='streamlit:render'){ args=d.args||{}; runBtn.style.display = args.action==='voice_synthesize' ? 'none' : 'inline-block';
    runBtn.textContent =
      (args.action==='health' || args.action==='voice_health') ? 'Kiểm tra lại' :
      'Tạo avatar bằng OpenAvatar Runtime'; runBtn.onclick=execute; if(args.action==='health' || args.action==='voice_health' || args.action==='voice_synthesize') {
      execute();
    } else {
      statusEl.textContent='Sẵn sàng gửi dữ liệu tới OpenAvatar Runtime trên máy này.';
    } post('streamlit:setFrameHeight',{height:88}); }});
ready();
</script></body></html>
